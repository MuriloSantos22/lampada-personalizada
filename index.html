<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Lâmpada Interativa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">Projeto JavaScript</p>
      <h1>Controle a luz</h1>
      <p class="subtitle">Clique no botão para acender ou apagar a lâmpada.</p>
    </header>

    <section class="lamp-stage" aria-label="Controle da lâmpada">
      <div class="lamp" id="lamp" aria-hidden="true">
        <div class="glow"></div>
        <div class="bulb">
          <div class="filament"></div>
        </div>
        <div class="socket"></div>
      </div>

      <p class="status" id="status" aria-live="polite">
        A lâmpada está <strong>apagada</strong>
      </p>

      <button class="power-button" id="powerButton" type="button" aria-pressed="false">
        <span class="power-icon" aria-hidden="true">⏻</span>
        <span id="buttonText">Acender lâmpada</span>
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
